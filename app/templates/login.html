<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - オークションシートAI診断</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topnav">
    <div class="brand">🚗 オークションシートAI診断</div>
  </header>
  <main style="max-width: 420px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <div class="card">
      <h1>ログイン</h1>
      <p class="muted">社内共有の合言葉と、あなたの名前を入力してください。名前は診断履歴・フィードバックの記録に使われます。</p>
      <form method="post">
        <label>名前（ニックネーム可）</label>
        <input type="text" name="user_name" required placeholder="例: 田中">
        <label>合言葉</label>
        <input type="password" name="password" required>
        <button class="btn" type="submit">入る</button>
      </form>
    </div>
  </main>
</body>
</html>
