<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('login_h1') }} - {{ t('app_title') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topnav">
    <div class="brand">🚗 {{ t('app_title') }}</div>
    <nav>
      {% if lang == 'en' %}
      <a href="{{ url_for('set_lang', code='ja') }}" class="lang-link">日本語</a>
      {% else %}
      <a href="{{ url_for('set_lang', code='en') }}" class="lang-link">EN</a>
      {% endif %}
    </nav>
  </header>
  <main style="max-width: 420px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <div class="card">
      <h1>{{ t('login_h1') }}</h1>
      <p class="muted">{{ t('login_desc') }}</p>
      <form method="post">
        <label>{{ t('your_name') }}</label>
        <input type="text" name="user_name" required>
        <label>{{ t('passphrase') }}</label>
        <input type="password" name="password" required>
        <button class="btn" type="submit">{{ t('enter_btn') }}</button>
      </form>
    </div>
  </main>
</body>
</html>
